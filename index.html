<title>PHILSTAN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Disposition : rail de navigation à gauche (grand écran) ou barre d'onglets en bas (téléphone), colonne de lecture au centre. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface2:#EBEDF4; --fg:#151827; --muted:#596079; --line:#D9DDE8;
  --accent:#2638B8; --accent-fg:#FFFFFF; --accent-soft:#E3E7FA;
  --gold:#8F6210; --gold-soft:#F6EBCF;
  --ok:#1D7A4D; --ok-soft:#DDF3E8; --warn:#9A5800; --bad:#B3261E; --bad-soft:#FBE3E1;
  --f-display:'Alegreya',Georgia,'Times New Roman',serif;
  --f-ui:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --fs:1; --f-read:var(--f-display);
  --shadow:0 1px 2px rgba(20,24,50,.06),0 4px 14px rgba(20,24,50,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E111C; --surface:#161B2B; --surface2:#1E2438; --fg:#E6E8F2; --muted:#9AA2BD; --line:#2A3150;
    --accent:#93A5FF; --accent-fg:#0E111C; --accent-soft:#232C5A;
    --gold:#E0B65C; --gold-soft:#3A3014;
    --ok:#5CCB93; --ok-soft:#173A2B; --warn:#E3A04A; --bad:#FF8A80; --bad-soft:#4A1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E111C; --surface:#161B2B; --surface2:#1E2438; --fg:#E6E8F2; --muted:#9AA2BD; --line:#2A3150;
  --accent:#93A5FF; --accent-fg:#0E111C; --accent-soft:#232C5A;
  --gold:#E0B65C; --gold-soft:#3A3014;
  --ok:#5CCB93; --ok-soft:#173A2B; --warn:#E3A04A; --bad:#FF8A80; --bad-soft:#4A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:calc(17px * var(--fs));line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1.02rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:28px}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:22px 0;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:.04em;text-decoration:none;color:var(--fg)}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:1.1rem;font-family:var(--f-display)}
.brand small{display:block;font-family:var(--f-ui);font-weight:500;font-size:.7rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{min-width:0;padding-block:24px 56px;max-width:1080px;width:100%}
.tabbar{display:none}

@media (max-width: 900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-between}
  .tabbar a,.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:500;cursor:pointer;border-radius:8px}
  .tabbar svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
}

/* ---------- Pieces ---------- */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.pagehead p{color:var(--muted);max-width:62ch;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.split>.listcol{max-height:none}}
.listcol{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.card h3{margin-bottom:8px}
.card.click{cursor:pointer;transition:border-color .15s,transform .15s}
.card.click:hover{border-color:var(--accent)}
.band{background:var(--accent-soft);border:1px solid transparent;border-radius:14px;padding:16px}
.note-gold{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.warn-box{background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--surface2);color:var(--fg);font-size:.82rem;border:1px solid transparent;text-decoration:none;cursor:default}
button.chip,a.chip,.chip.click{cursor:pointer}
button.chip:hover,a.chip:hover,.chip.click:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.code{font-family:var(--f-mono);font-size:.76rem}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.label{font-size:.82rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:38px}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.check span{min-width:0}
.check.done span{color:var(--muted);text-decoration:line-through}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 14px;color:var(--muted);cursor:pointer;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}

.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.gold>i{background:var(--gold)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--fg)}
.item:hover{background:var(--surface2)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item .t{min-width:0;flex:1}
.item .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.groupname{margin:14px 4px 4px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.ref{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.ref:last-child{border-bottom:0}
.ref div{min-width:0}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}

/* ---------- Markdown ---------- */
.md{font-family:var(--f-read);font-size:1.08em;line-height:1.62;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{margin:1.2em 0 .45em}
.md h1{font-size:1.6rem}.md h2{font-size:1.3rem}.md h3{font-size:1.12rem}
.md p{margin:.6em 0}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.18em 0}
.md blockquote{margin:.8em 0;padding:.2em 1em;border-left:3px solid var(--gold);color:var(--muted);font-style:italic}
.md code{font-family:var(--f-mono);font-size:.82em;background:var(--surface2);padding:1px 5px;border-radius:5px}
.md pre{background:var(--surface2);padding:10px 12px;border-radius:10px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md .tag{color:var(--gold);font-family:var(--f-ui);font-weight:700;font-size:.9em;cursor:pointer}
.md .wl{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer;font-family:var(--f-ui)}
.md .wl.new{color:var(--muted);border-bottom-style:dashed}
.md .wl.phil{color:var(--gold)}
.md .cite{font-family:var(--f-ui);font-size:.88em;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;cursor:pointer}
.md .cite.missing{background:var(--bad-soft);color:var(--bad)}
.md .task{list-style:none;margin-left:-1.2em}

/* ---------- Notes ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.editor{grid-template-columns:minmax(0,1fr)}}
.editor textarea{min-height:46vh;font-family:var(--f-mono);font-size:.88rem;line-height:1.55;tab-size:2}
.titleinput{font-family:var(--f-display);font-size:1.5rem;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;background:none;padding-inline:0}
.titleinput:focus{box-shadow:none;border-color:var(--accent)}
.graph{width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.graph text{fill:var(--fg);font-family:var(--f-ui);font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.graph line{stroke:var(--line);stroke-width:1.2}
.graph circle{cursor:pointer}

/* ---------- Flashcards / quiz ---------- */
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:26px 18px}
.flash .q{font-family:var(--f-display);font-size:1.45rem;line-height:1.3}
.flash .a{font-size:1.1rem;border-top:1px dashed var(--line);padding-top:14px;text-align:left;font-family:var(--f-read)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:2.2rem;letter-spacing:.04em}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(680px,100%);margin-top:6vh;padding:18px;display:flex;flex-direction:column;gap:12px}
.palette input{font-size:1.1rem;min-height:46px}
.palette .res{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;box-shadow:var(--shadow);max-width:90vw}
@media (min-width:901px){.toast{bottom:28px}}
.hero{padding:22px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:2.1rem}
.hero .quote{font-family:var(--f-display);font-style:italic;font-size:1.2rem;line-height:1.35}
.hero .btn{background:rgba(255,255,255,.14);color:inherit;border-color:rgba(255,255,255,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:var(--accent-soft);color:var(--fg)}}
:root[data-theme="dark"] .hero{background:var(--accent-soft);color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
:root[data-motion="off"] *{transition:none!important;animation:none!important}
</style>
<div id="app"></div><div id="overlay"></div><div id="toast"></div>

const PERIODES=[
 {id:'antique',n:'Antiquité'},{id:'medieval',n:'Moyen Âge'},{id:'moderne',n:'Moderne (XVIe–XVIIe s.)'},
 {id:'lumieres',n:'Lumières (XVIIIe s.)'},{id:'xixe',n:'XIXe siècle'},{id:'xxe',n:'XXe siècle'},{id:'contemp',n:'Contemporain'}
];

const PHILOS=[
{id:'parmenide',n:'Parménide d\'Élée',d:'c. 515–450 av. J.-C.',p:'antique',t:'Éléates',th:['metaphysique','epistemologie','antique'],w:['Poème (Sur la nature)'],by:[],to:['platon'],i:'L\'être est et le non-être n\'est pas : changement et pluralité relèvent de l\'opinion, seule la raison atteint la vérité.'},

{id:'aristote',n:'Aristote',d:'384–322 av. J.-C.',p:'antique',t:'Aristotélisme, Lycée',th:['metaphysique','logique','ethique','politique','esthetique','vivant','antique'],w:['Organon','Physique','Métaphysique','De l\'âme','Éthique à Nicomaque','Politique','Poétique'],by:['platon','parmenide'],to:['avicenne','averroes','thomas'],i:'Le bonheur (eudaimonia) est activité de l\'âme selon la vertu ; la substance est composée de matière et de forme ; invention de la logique syllogistique.',c:'PHI-1004'},
{id:'epicure',n:'Épicure',d:'341–270 av. J.-C.',p:'antique',t:'Épicurisme',th:['ethique','antique'],w:['Lettre à Ménécée','Maximes capitales'],by:[],to:[],i:'Le plaisir bien compris, absence de trouble (ataraxie) et de douleur, est la fin de la vie ; la mort n\'est rien pour nous.'},

{id:'concepts',t:'Analyse conceptuelle',niv:'LM',dur:'1 à 3 h',
 r:'Clarifier un concept par ses usages, ses conditions d\'application, des cas paradigmes et des contre-exemples.',
 e:['Recueillir des usages ordinaires et savants du terme.','Proposer une définition provisoire (conditions nécessaires et suffisantes).','Chercher des contre-exemples : cas où la définition inclut trop ou trop peu.','Affiner, ou distinguer plusieurs sens (distinction conceptuelle).','Justifier le choix de définition par ce qu\'elle permet d\'expliquer.','Mesurer les enjeux théoriques et pratiques de la distinction.'],
 c:['J\'ai testé ma définition par au moins deux contre-exemples','Mes distinctions sont nommées et stables dans tout le texte','Je dis pourquoi cette définition est la plus utile'],
 p:['Définir un mot par un synonyme.','Changer de sens en cours de texte (équivoque).','Chercher « la vraie définition » sans critère d\'adéquation.'],
 m:'# Analyse du concept : [concept]\n\n## Usages\n\n## Définition provisoire\n\n## Contre-exemples\n\n## Distinctions\n\n## Définition retenue et justification\n'},
{id:'arguments',t:'Reconstruire et évaluer un argument',niv:'LMD',dur:'20 à 60 min',
 r:'Mettre un raisonnement sous forme standard (prémisses, conclusion), puis évaluer sa validité et la vérité de ses prémisses.',
 e:['Repérer la conclusion (indicateurs : donc, par conséquent, il s\'ensuit que).','Lister les prémisses explicites, numérotées.','Ajouter les prémisses implicites nécessaires (en restant charitable).','Identifier la forme (modus ponens, syllogisme, réduction à l\'absurde…).','Évaluer la validité : si les prémisses étaient vraies, la conclusion devrait l\'être.','Évaluer chaque prémisse : laquelle est la plus discutable, pourquoi ?','Formuler l\'objection : nier une prémisse, montrer l\'invalidité, ou proposer un contre-exemple.'],
 c:['Chaque prémisse tient en une phrase simple','Mes prémisses implicites sont signalées comme telles','J\'ai séparé validité et vérité des prémisses','J\'ai appliqué le principe de charité'],
 p:['Réfuter une version affaiblie de l\'argument (homme de paille).','Confondre invalidité et fausseté de la conclusion.','Oublier une prémisse implicite décisive.'],
 m:'# Argument : [titre]\n\n## Conclusion\n\n## Prémisses\n1.\n2.\n3.\n\n## Prémisses implicites\n\n## Forme\n\n## Validité\n\n## Prémisse la plus fragile\n\n## Objection\n'},
{id:'objections',t:'Objections et réponses (méthode de la disputatio)',niv:'LMD',dur:'30 min à 2 h',
 r:'Mettre sa thèse à l\'épreuve : formuler la meilleure objection possible, puis y répondre. Méthode héritée de la scolastique.',
 e:['Énoncer la thèse en une phrase précise.','Chercher l\'objection la plus forte (ce qu\'un adversaire compétent dirait), pas la plus facile.','Distinguer : objection, contre-exemple, réfutation, simple désaccord.','Répondre : nier une prémisse, distinguer deux sens, concéder en limitant la portée, ou intégrer l\'objection dans la thèse.','Évaluer ce que la réponse coûte (nouvelles thèses à défendre).','Reprendre la thèse révisée.'],
 c:['L\'objection est reformulée de façon à satisfaire son défenseur','Ma réponse vise une prémisse précise','J\'ai noté ce que je concède'],
 p:['Anticiper seulement des objections faibles.','Répondre à côté de l\'objection.','Défendre une thèse impossible à réfuter parce qu\'elle ne dit rien.'],
 m:'# Objection – réponse\n\n## Thèse\n\n## Objection (version la plus forte)\n\n## Réponse\n\n## Ce que je concède\n\n## Thèse révisée\n'},
{id:'lecture',t:'Lecture lente et fiche de lecture',niv:'LMD',dur:'1 à 3 h par texte',
 r:'Lire en trois passes (survol, lecture suivie, reprise critique) et consigner l\'essentiel dans une fiche réutilisable.',
 e:['Survol : titre, table des matières, introduction, conclusion, plan.','Lecture suivie : annoter la thèse, les arguments, les mots-clés, les passages obscurs.','Reformuler chaque section en une phrase.','Noter 3 à 5 citations clés avec la page exacte.','Formuler ce qui reste obscur et ce qui paraît discutable.','Relier le texte à d\'autres lectures (liens [[ ]] dans vos notes).'],
 c:['Je peux résumer la thèse sans le texte','Mes citations portent une page précise','J\'ai noté au moins une objection','La fiche est liée à la notice de la bibliothèque'],
 p:['Surligner sans reformuler.','Prendre des notes qui recopient le texte.','Ne jamais retourner au texte après la fiche.'],
 m:'# Fiche : [auteur, titre]\n\n**Référence** : [@clé]\n\n## Thèse\n\n## Structure\n\n## Arguments clés\n\n## Concepts\n\n## Citations (avec pages)\n> « … » (p. )\n\n## Questions et objections\n\n## Liens\n- [[ ]]\n'},
{id:'recherche',t:'Recherche documentaire et état de la question',niv:'MD',dur:'2 à 6 semaines',
 r:'Cartographier ce qui a été dit sur une question avant de se positionner : sources primaires, littérature critique, débats récents.',
 e:['Définir la question et 5 à 10 mots-clés (français, anglais, termes techniques).','Interroger les bases : catalogue de la bibliothèque, Érudit, Persée, Cairn, PhilPapers, SEP, Google Scholar.','Remonter les bibliographies des textes clés (citations amont) et chercher qui les cite (citations aval).','Classer les sources par position dans le débat, pas par ordre alphabétique.','Noter chaque source dans Ma bibliothèque et rédiger une fiche pour les textes centraux.','Rédiger l\'état de la question : positions, prémisses, points de désaccord, angle mort que votre travail occupe.'],
 c:['Mes mots-clés couvrent plusieurs langues et vocabulaires','J\'ai repéré 3 à 5 textes de référence du débat','Mes sources sont classées par positions','Je peux dire en une phrase ce que mon travail apporte'],
 p:['S\'arrêter aux résultats de la première page.','Ignorer la littérature en langue originale.','Accumuler des références sans les lire.'],
 m:'# État de la question : [sujet]\n\n## Question\n\n## Mots-clés\n\n## Positions\n### Position A\n### Position B\n### Position C\n\n## Points de désaccord\n\n## Lacune que mon travail occupe\n\n## Sources centrales\n- [@clé]\n'},
{id:'redaction',t:'Rédaction, citation et intégrité',niv:'LMD',dur:'en continu',
 r:'Écrire clairement : un paragraphe, une idée ; citer avec exactitude ; éviter le plagiat ; réviser en trois temps.',
 e:['Un paragraphe = une idée (énoncé, raison, exemple ou référence, lien avec la suite).','Annoncer, puis démontrer ; supprimer ce qui n\'avance pas l\'argument.','Citations courtes dans le texte, citations longues en retrait ; toujours commentées.','Un style de citation unique et cohérent dans tout le travail (notes de bas de page ou auteur-date, selon la consigne).','Indiquer chaque emprunt d\'idée, même reformulé ; vérifier les règles de l\'établissement sur le plagiat.','Réviser en trois temps : structure, paragraphes, phrases ; relire à voix haute.'],
 c:['Chaque paragraphe a un énoncé clair','Toutes mes citations ont leur référence complète','Mon style de citation est cohérent','J\'ai relu à voix haute','La bibliographie correspond aux références citées'],
 p:['Phrases trop longues et ambiguës.','Jargon non défini.','Références approximatives (« selon Kant… »).'],
 m:'# Plan de révision\n\n## Structure\n- [ ] La thèse est annoncée dès l\'introduction\n- [ ] L\'ordre des parties est logique\n\n## Paragraphes\n- [ ] Une idée par paragraphe\n\n## Phrases\n- [ ] Termes définis\n- [ ] Citations exactes\n'},
{id:'memoire',t:'Mémoire de maîtrise (Université Laval)',niv:'M',dur:'2 ans à temps complet',
 r:'Cadre officiel : 45 crédits (15 de cours, 30 de recherche : PHI-6811 [6 cr.], PHI-6812, PHI-6813, PHI-6814 [8 cr. chacune]). Jury d\'au moins trois examinateurs.',
 e:['Choisir un sujet précis dans un domaine de recherche reconnu par la Faculté et prendre contact avec une direction (à trouver durant les deux premières sessions).','Rédiger le projet : question, état de la question, thèse provisoire, corpus, méthode, plan, calendrier. Faire approuver par les directions de recherche et de programme (avant la fin de la troisième session).','Planifier un calendrier par session avec des livrables intermédiaires (proposition à ajuster avec votre direction).','Lire, fiche par fiche, le corpus et la littérature critique ; tenir un journal de recherche.','Rédiger par chapitres, remis à la direction à intervalles réguliers.','Réviser la version complète, vérifier la bibliographie et les citations.','Déposer le mémoire ; préparer l\'évaluation par le jury et les corrections.'],
 c:['Ma direction a confirmé son accord','Mon projet est approuvé','J\'ai un calendrier daté','Je remets un texte à ma direction au moins une fois par mois','Mes chapitres ont chacun une thèse claire'],
 p:['Choisir un sujet trop vaste pour 2 ans.','Écrire tardivement : rédiger dès l\'état de la question.','Attendre un texte parfait avant de le remettre.'],
 m:'# Projet de mémoire\n\n## Question de recherche\n\n## Thèse provisoire\n\n## État de la question\n\n## Corpus\n\n## Méthode\n\n## Plan\n1.\n2.\n3.\n\n## Calendrier\n- Session 1 :\n- Session 2 :\n- Session 3 :\n- Session 4 :\n\n## Direction\n'},
{id:'these',t:'Thèse de doctorat (Université Laval)',niv:'D',dur:'4 ans à temps complet',
 r:'Cadre officiel : 90 crédits (18 communs dont l\'examen de doctorat, 72 de recherche : PHI-8801 à PHI-8808). Thèse évaluée ; comité de thèse approuvé par la direction de programme.',
 e:['Cadrer : question, thèse défendue, contribution originale, corpus, méthode.','Faire approuver le projet de thèse (avant la fin de la troisième session).','Réussir l\'examen de doctorat avant 45 crédits (volets prospectif et rétrospectif).','Écrire l\'état de la question et un « chapitre zéro » qui expose l\'argument d\'ensemble en 5 pages.','Rédiger les chapitres dans l\'ordre de l\'argument ; tester chacun par une communication ou un article.','Maintenir une cartographie des arguments de la thèse (voir le graphe des notes).','Assembler, uniformiser, réviser ; déposer ; préparer l\'évaluation.'],
 c:['Ma contribution originale tient en deux phrases','Mon examen de doctorat est planifié','Mes chapitres s\'enchaînent par des prémisses explicites','Un chapitre a été présenté devant un public critique','Mon calendrier contient des marges pour les révisions'],
 p:['Une thèse qui devient un compte rendu de littérature.','Reporter les communications et articles.','Travailler isolé de la direction et du comité.'],
 m:'# Cadrage de thèse\n\n## Problème\n\n## Thèse défendue\n\n## Contribution originale\n\n## Corpus et méthode\n\n## Plan provisoire\n- Chapitre 0 :\n- Chapitre 1 :\n- Chapitre 2 :\n- Chapitre 3 :\n- Chapitre 4 :\n\n## Calendrier (4 ans)\n'},
{id:'examdoc',t:'Examen de doctorat : préparation',niv:'D',dur:'3 à 6 mois',
 r:'Cadre officiel : épreuve orale et écrite, avec volet rétrospectif et volet prospectif, à réussir avant 45 crédits. Les directives détaillées sont à obtenir auprès de la direction de programme.',
 e:['Obtenir par écrit les consignes de la Faculté : format, durée, jury, contenu attendu pour chacun des deux volets.','Définir avec la direction les champs examinés et établir une liste de lectures raisonnée.','Rétrospectif : préparer des synthèses des grands débats et auteurs de vos champs, avec leurs enjeux.','Prospectif : préparer l\'argumentaire du projet de thèse (problème, thèse, apport, risques, calendrier).','Faire des simulations écrites et orales chronométrées avec des pairs.','Dresser la liste des questions difficiles probables et préparer des réponses en trois niveaux (une phrase, 2 minutes, 10 minutes).'],
 c:['J\'ai les consignes officielles écrites','Ma liste de lectures est validée','J\'ai fait au moins une simulation orale','Mon argumentaire de projet tient en 10 minutes'],

 m:'# Préparation de l\'examen de doctorat\n\n## Consignes officielles\n\n## Champs et listes de lectures\n\n## Volet rétrospectif : synthèses\n\n## Volet prospectif : argumentaire\n\n## Simulations\n\n## Questions difficiles\n'},
{id:'communication',t:'Communication et article scientifique',niv:'MD',dur:'4 à 10 semaines',
 r:'Proposer une communication (colloque) ou un article à une revue à comité de lecture : choisir le lieu, écrire un résumé, répondre aux évaluations.',
 e:['Choisir le lieu : colloque, revue, numéro thématique ; lire l\'appel et les consignes.','Rédiger un résumé : problème, thèse, méthode, résultat (250 à 500 mots, selon l\'appel).','Rédiger l\'article : introduction avec thèse, argument central, objection, conclusion ; 6 000 à 10 000 mots est courant, selon la revue.','Soumettre ; accepter que l\'évaluation par les pairs soit lente et critique.','Répondre point par point aux évaluateurs, en indiquant les modifications.','Archiver la version acceptée dans Ma bibliothèque.'],
 c:['Mon résumé annonce une thèse précise','Je respecte les consignes de la revue','J\'ai demandé une relecture à un pair'],
 p:['Envoyer un chapitre sans l\'adapter au format article.','Prendre un refus pour un jugement définitif.'],
 m:'# Proposition de communication\n\n## Titre\n\n## Résumé (250–500 mots)\n\n## Public visé\n\n## Calendrier\n'},
{id:'oral',t:'Exposé oral, séminaire et soutenance',niv:'LMD',dur:'préparation de 2 à 6 h',
 r:'Présenter clairement une thèse et ses raisons dans un temps limité, puis répondre aux questions avec précision.',
 e:['Formuler trois messages : problème, thèse, raison principale.','Structurer : ouverture, trois temps, conclusion ; une idée par diapositive (ou aucune).','Répéter chronométré, à voix haute, avec un auditeur critique.','Prévoir les questions : définitions, objection principale, application.','Répondre en quatre gestes : reformuler, distinguer, répondre, vérifier.','Pour une question hors champ : le dire, et proposer une piste.'],
 c:['Mon exposé tient dans le temps','Je peux annoncer ma thèse en 20 secondes','J\'ai préparé une réponse à l\'objection principale'],

 m:'# Exposé : [titre]\n\n## Trois messages\n1.\n2.\n3.\n\n## Plan minuté\n\n## Questions probables\n'},
{id:'langues',t:'Langues de travail et textes en version originale',niv:'LMD',dur:'en continu',
 r:'La philosophie se lit souvent en anglais, en allemand, en latin ou en grec ancien. Au baccalauréat de Laval : anglais (niveau avancé I) ou allemand (intermédiaire I) ; la maîtrise et le doctorat exigent la langue écrite des auteurs étudiés.',

{id:'examens',t:'Examens sur table',niv:'L',dur:'révision sur 3 semaines',

const SOPHISMES=[
{id:'ad-hominem',n:'Ad hominem',def:'Attaquer la personne qui défend une thèse plutôt que la thèse elle-même.',ex:'« Tu défends cette réforme parce que tu y gagnes : elle est donc mauvaise. »',a:'Séparer l\'origine ou les motifs d\'un argument de sa valeur. (La crédibilité d\'un témoin reste, elle, pertinente.)'},
{id:'homme-paille',n:'Homme de paille',def:'Déformer ou affaiblir la position adverse pour la réfuter facilement.',ex:'« Tu veux limiter la vitesse ? Tu veux donc interdire toutes les voitures ! »',a:'Reformuler la thèse de l\'autre jusqu\'à ce qu\'il l\'approuve (principe de charité).'},
{id:'pente',n:'Pente glissante',def:'Soutenir qu\'un premier pas entraînera inévitablement une série de conséquences, sans le justifier.',ex:'« Si l\'on autorise X, on autorisera bientôt Y, puis Z. »',a:'Demander la raison de chaque passage. Le risque réel doit être argumenté.'},
{id:'faux-dilemme',n:'Faux dilemme',def:'Ne présenter que deux options alors qu\'il en existe d\'autres.',ex:'« Soit tu es avec nous, soit tu es contre nous. »',a:'Chercher une troisième voie, une nuance, une combinaison.'},
{id:'petition',n:'Pétition de principe',def:'Supposer dans les prémisses ce que la conclusion devait prouver.',ex:'« Cette loi est juste, car elle est équitable » (si « équitable » veut dire « juste »).',a:'Se demander si un sceptique pourrait accepter les prémisses sans déjà accepter la conclusion.'},
{id:'generalisation',n:'Généralisation hâtive',def:'Tirer une règle générale d\'un échantillon trop petit ou biaisé.',ex:'« Deux étudiants de ce programme ont échoué : ce programme est mauvais. »',a:'Interroger la taille et la représentativité de l\'échantillon.'},
{id:'post-hoc',n:'Post hoc ergo propter hoc',def:'Conclure à la causalité à partir de la seule succession temporelle.',ex:'« J\'ai bu cette tisane et mon rhume a disparu : elle guérit. »',a:'Chercher une troisième cause, le hasard, la direction inverse.'},
{id:'autorite',n:'Appel à une autorité illégitime',def:'S\'appuyer sur quelqu\'un dont la compétence ne porte pas sur la question.',ex:'« Un célèbre acteur affirme que ce traitement fonctionne. »',a:'Vérifier : expertise dans le domaine, accord des spécialistes, absence de conflit d\'intérêts.'},
{id:'popularite',n:'Appel à la popularité',def:'Tenir pour vraie ou bonne une idée parce que beaucoup de gens y adhèrent.',ex:'« Tout le monde pense ainsi, donc c\'est vrai. »',a:'Distinguer ce que l\'on croit de ce qui est justifié.'},
{id:'nature',n:'Appel à la nature',def:'Considérer comme bon ce qui est naturel, ou mauvais ce qui est artificiel.',ex:'« C\'est naturel, donc c\'est bon pour la santé. »',a:'Demander ce que « naturel » signifie et pourquoi cela entraînerait la valeur.'},
{id:'is-ought',n:'Passage de l\'être au devoir-être',def:'Tirer une conclusion normative de seules prémisses descriptives, sans prémisse normative (guillotine de Hume).',ex:'« Les humains se sont toujours fait la guerre ; donc la guerre est légitime. »',a:'Chercher la prémisse normative cachée et la discuter.'},
{id:'equivoque',n:'Équivoque',def:'Utiliser un même mot en deux sens différents dans un même raisonnement.',ex:'« Une loi suppose un législateur ; la gravité est une loi ; donc la gravité a un législateur. »',a:'Réécrire l\'argument en remplaçant chaque occurrence ambiguë.'},
{id:'conseq',n:'Affirmation du conséquent',def:'De « si P alors Q » et Q, conclure P (forme invalide).',ex:'« S\'il pleut, la rue est mouillée ; la rue est mouillée ; donc il a plu. »',a:'Chercher une autre cause possible de Q.'},
{id:'antecedent',n:'Négation de l\'antécédent',def:'De « si P alors Q » et non-P, conclure non-Q (forme invalide).',ex:'« S\'il pleut, la rue est mouillée ; il ne pleut pas ; donc la rue n\'est pas mouillée. »',a:'Même remède : Q peut avoir d\'autres causes.'},
{id:'composition',n:'Composition et division',def:'Attribuer au tout ce qui vaut des parties (composition), ou aux parties ce qui vaut du tout (division).',ex:'« Chaque joueur est excellent, donc l\'équipe est excellente. »',a:'Se demander si la propriété se transmet des parties au tout (ou l\'inverse).'},
{id:'tu-quoque',n:'Tu quoque',def:'Réfuter une thèse en signalant l\'incohérence de celui qui la défend.',ex:'« Tu me dis de ne pas fumer, mais tu fumes toi-même. »',a:'L\'incohérence de l\'orateur ne rend pas la thèse fausse.'},
{id:'diversion',n:'Diversion (faux-fuyant)',def:'Détourner la discussion vers un autre sujet pour éviter l\'objection.',ex:'« Peut-on parler du budget ? Et la sécurité, alors ? »',a:'Revenir à la question initiale et la formuler à nouveau.'},
{id:'complexe',n:'Question complexe',def:'Poser une question qui présuppose une réponse non accordée.',ex:'« As-tu cessé de tricher ? »',a:'Refuser le présupposé avant de répondre.'},
{id:'ignorance',n:'Appel à l\'ignorance',def:'Soutenir qu\'une thèse est vraie parce que personne n\'a prouvé qu\'elle est fausse (ou inversement).',ex:'« Personne n\'a prouvé que ce phénomène n\'existe pas ; donc il existe. »',a:'Le fardeau de la preuve pèse sur celui qui affirme.'},
{id:'genetique',n:'Sophisme génétique',def:'Rejeter ou accepter une idée à cause de son origine plutôt que de sa valeur actuelle.',ex:'« Cette idée vient de tel courant, donc elle est fausse. »',a:'Distinguer genèse et validité.'},
{id:'tradition',n:'Appel à la tradition',def:'Défendre une pratique au motif qu\'on l\'a toujours suivie.',ex:'« On a toujours fait ainsi : il n\'y a pas à changer. »',a:'Demander quelles raisons soutiennent la pratique aujourd\'hui.'},
{id:'ecossais',n:'Aucun vrai Écossais',def:'Redéfinir un terme pour exclure les contre-exemples.',ex:'« Aucun vrai philosophe ne dirait cela. » — « Mais tel philosophe l\'a dit. » — « Alors ce n\'est pas un vrai philosophe. »',a:'Fixer la définition avant d\'examiner les cas.'}
];

const FORMES=[
{n:'Modus ponens',f:'P → Q ; P ⊢ Q',ex:'S\'il pleut, la rue est mouillée ; il pleut ; donc la rue est mouillée.',v:true},
{n:'Modus tollens',f:'P → Q ; ¬Q ⊢ ¬P',ex:'S\'il pleut, la rue est mouillée ; la rue n\'est pas mouillée ; donc il ne pleut pas.',v:true},
{n:'Syllogisme hypothétique',f:'P → Q ; Q → R ⊢ P → R',ex:'Si je lis, j\'apprends ; si j\'apprends, je progresse ; donc si je lis, je progresse.',v:true},
{n:'Syllogisme disjonctif',f:'P ∨ Q ; ¬P ⊢ Q',ex:'La cause est interne ou externe ; elle n\'est pas interne ; donc elle est externe.',v:true},
{n:'Dilemme constructif',f:'P → Q ; R → S ; P ∨ R ⊢ Q ∨ S',ex:'Si je reste, je m\'ennuie ; si je pars, je regrette ; je reste ou je pars ; donc je m\'ennuie ou je regrette.',v:true},
{n:'Contraposition',f:'P → Q ⊣⊢ ¬Q → ¬P',ex:'« Si c\'est un cygne, c\'est un oiseau » équivaut à « si ce n\'est pas un oiseau, ce n\'est pas un cygne ».',v:true},

const KEYS=['settings','progress','notes','lib','srs','cards','log','meth'];
const DEFAULT_SETTINGS={level:'L',theme:'auto',font:1,readFont:'serif',cite:'chicago',newPerDay:10,goalMin:60,focus:25,rest:5,motion:true,onboarded:false};
const S={settings:{...DEFAULT_SETTINGS},progress:{done:{},cr:{},jal:{}},notes:[],lib:[],srs:{},cards:[],log:{},meth:{}};
const LS='philstan.v1.';
const Store={cloud:null,uid:null,status:'local',err:'',t:{},n:{},timers:{},busy:{},again:{},
 loadLocal(){
  for(const k of KEYS){try{const r=localStorage.getItem(LS+k);if(r){const o=JSON.parse(r);if(o&&o.v!==undefined){S[k]=o.v;Store.t[k]=o.t||0}}}catch(e){}}
  S.settings={...DEFAULT_SETTINGS,...(S.settings||{})};
  S.progress=Object.assign({done:{},cr:{},jal:{}},S.progress||{});
 },
 saveLocal(k){try{localStorage.setItem(LS+k,JSON.stringify({t:Store.t[k],v:S[k]}))}catch(e){}},
 touch(k){
  Store.t[k]=Date.now();Store.saveLocal(k);
  clearTimeout(Store.timers[k]);Store.timers[k]=setTimeout(()=>Store.push(k),900);
 },
 size(k){try{return JSON.stringify(S[k]).length}catch(e){return 0}},
 async push(k){
  if(!Store.cloud)return;
  if(Store.busy[k]){Store.again[k]=true;return}
  Store.busy[k]=true;
  try{
   const json=JSON.stringify(S[k]);const CH=80000;const parts=[];
   for(let i=0;i<json.length;i+=CH)parts.push(json.slice(i,i+CH));
   if(!parts.length)parts.push('null');
   const col=Store.cloud.collection('data/users/'+Store.uid);
   for(let i=0;i<parts.length;i++)await col.doc(k+'_'+i).set({j:parts[i]});
   const prev=Store.n[k]||0;
   for(let i=parts.length;i<prev;i++)await col.doc(k+'_'+i).delete();
   await col.doc(k).set({n:parts.length,t:Store.t[k],size:json.length});
   Store.n[k]=parts.length;Store.status='cloud';Store.err='';
  }catch(e){
   const was=Store.status;Store.status='error';Store.err=(e&&e.code)||String(e);
   if(was!=='error')toast('Synchronisation indisponible : vos données restent sur cet appareil.');
  }
  Store.busy[k]=false;
  if(Store.again[k]){Store.again[k]=false;Store.push(k)}
  updateSync();
 },
 async pull(){
  const col=Store.cloud.collection('data/users/'+Store.uid);let changed=false;
  for(const k of KEYS){
   const m=await col.doc(k).get();
   if(!m.exists){if(Store.t[k])Store.push(k);continue}
   const md=m.data()||{};const ct=md.t||0;Store.n[k]=md.n||0;
   if(ct>(Store.t[k]||0)){
    let s='';
    for(let i=0;i<(md.n||0);i++){const d=await col.doc(k+'_'+i).get();s+=((d.data()||{}).j||'')}
    try{S[k]=JSON.parse(s);Store.t[k]=ct;Store.saveLocal(k);changed=true}catch(e){}
   }else if((Store.t[k]||0)>ct){Store.push(k)}
  }
  S.settings={...DEFAULT_SETTINGS,...(S.settings||{})};
  S.progress=Object.assign({done:{},cr:{},jal:{}},S.progress||{});
  return changed;
 }
};
function updateSync(){
 const txt=Store.status==='cloud'?'Synchronisé':Store.status==='error'?'Sauvegarde locale':'Cet appareil';
 $$('[data-sync]').forEach(el=>{el.textContent=txt});
}

function addLog(o){const l=logDay();for(const k in o)l[k]=(l[k]||0)+o[k];Store.touch('log')}
function streak(){
 let d=today(),n=0;const act=x=>{const l=S.log[x];return l&&(l.m>0||l.c>0||l.t>0)};
 if(!act(d))d=addDays(d,-1);
 while(act(d)){n++;d=addDays(d,-1)}
 return n;
}

function resolveLink(name){
 const n=norm(name.trim());if(!n)return null;
 const note=S.notes.find(x=>norm(x.title)===n);if(note)return{type:'note',id:note.id};
 const p=PHILOS.find(x=>norm(x.n)===n||x.id===n||norm(lastName(x.n))===n);if(p)return{type:'phil',id:p.id};
 const t=THEMES.find(x=>norm(x.t)===n||x.id===n);if(t)return{type:'theme',id:t.id};
 if(/^[a-z]{3}-\d{4}$/.test(n))return{type:'course',id:n.toUpperCase()};
 return null;
}
function wikilink(a,b){
 const name=unesc(a).trim(),r=resolveLink(name),label=b||a;
 if(!r)return '<a class="wl new" data-act="wl-new" data-arg="'+esc(name)+'" title="Créer la note">'+label+'</a>';
 return '<a class="wl '+(r.type==='note'?'':'phil')+'" data-act="wl" data-type="'+r.type+'" data-id="'+esc(r.id)+'">'+label+'</a>';
}
function citeHtml(key){
 const e=S.lib.find(x=>x.key===key);
 if(!e)return '<span class="cite missing" title="Référence introuvable">['+esc(key)+']</span>';
 return '<span class="cite" data-act="openlib" data-arg="'+esc(e.id)+'">'+esc(shortCite(e))+'</span>';
}
function inl(t){
 const codes=[];
 t=esc(t);
 t=t.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
 t=t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,a,b)=>wikilink(a,b));
 t=t.replace(/\[@([A-Za-z0-9_:.\-]+)\]/g,(_,k)=>citeHtml(k));
 t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 t=t.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/(^|[\s(])_([^_\s][^_]*)_/g,'$1<em>$2</em>');
 t=t.replace(/(^|[\s(>])#([\p{L}][\p{L}\p{N}_-]*)/gu,(_,p,g)=>p+'<span class="tag" data-act="tag" data-arg="'+g+'">#'+g+'</span>');
 t=t.replace(/\u0000(\d+)\u0000/g,(_,i)=>'<code>'+codes[i]+'</code>');
 return t;
}
function md(src){
 const lines=String(src||'').replace(/\r/g,'').split('\n');const out=[];let i=0,list=null;
 const close=()=>{if(list){out.push('</'+list+'>');list=null}};
 while(i<lines.length){
  const L=lines[i];let m;
  if(/^```/.test(L)){close();const b=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){b.push(lines[i]);i++}i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
  if((m=L.match(/^(#{1,4})\s+(.*)$/))){close();out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');i++;continue}
  if(/^\s*(---|\*\*\*)\s*$/.test(L)){close();out.push('<hr>');i++;continue}
  if(/^\s*\|/.test(L)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
   close();const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
   const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
   const head=cells(rows[0]);const body=rows.slice(2).map(cells);
   out.push('<div class="table-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
   continue;
  }
  if((m=L.match(/^>\s?(.*)$/))){close();const b=[m[1]];i++;while(i<lines.length&&(m=lines[i].match(/^>\s?(.*)$/))){b.push(m[1]);i++}out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>');continue}
  if((m=L.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li class="task">'+(m[1]===' '?'☐':'☑')+' '+inl(m[2])+'</li>');i++;continue}
  if((m=L.match(/^\s*[-*]\s+(.*)$/))){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+inl(m[1])+'</li>');i++;continue}
  if((m=L.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+inl(m[1])+'</li>');i++;continue}
  if(!L.trim()){close();i++;continue}
  close();const b=[L];i++;
  while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|>|```|\s*[-*]\s|\s*\d+[.)]\s|\s*\||\s*(---|\*\*\*)\s*$)/.test(lines[i])){b.push(lines[i]);i++}
  out.push('<p>'+inl(b.join(' '))+'</p>');
 }
 close();return out.join('\n');
}

const linksOf=t=>[...String(t||'').matchAll(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g)].map(m=>m[1].trim());

const TYPES={book:'Livre',article:'Article',chapter:'Chapitre',thesis:'Thèse ou mémoire',web:'Page web'};
function parseAuthors(txt){
 return String(txt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{
  if(l.includes(',')){const [f,...g]=l.split(',');return{f:f.trim(),g:g.join(',').trim()}}
  const w=l.split(/\s+/);return{f:w.slice(-1)[0],g:w.slice(0,-1).join(' ')};
 });
}
const given=a=>a.g;
const ini=a=>a.g.split(/[\s-]+/).filter(Boolean).map(x=>x[0].toUpperCase()+'.').join(' ');
function andList(arr,sep,last){if(arr.length<=1)return arr.join('');return arr.slice(0,-1).join(sep)+last+arr[arr.length-1]}
function shortCite(e){
 const A=parseAuthors(e.authors).map(a=>a.f);
 const n=A.length===0?(e.title||'?').split(' ').slice(0,2).join(' '):A.length===1?A[0]:A.length===2?A[0]+' et '+A[1]:A[0]+' et al.';
 return n+(e.year?' '+e.year:'');
}
function slugKey(e){
 const A=parseAuthors(e.authors);const base=norm((A[0]?A[0].f:(e.title||'ref').split(' ')[0])).replace(/[^a-z0-9]/g,'')||'ref';
 let k=base+(e.year||''),c=0;const taken=x=>S.lib.some(l=>l.key===x&&l.id!==e.id);
 while(taken(k)){c++;k=base+(e.year||'')+String.fromCharCode(96+c)}
 return k;
}
function citation(e,style){
 style=style||S.settings.cite;
 const A=parseAuthors(e.authors);const T=esc(e.title||'');const I=x=>'<i>'+esc(x)+'</i>';
 const yr=e.year?esc(e.year):'s. d.';const pages=e.pages?esc(e.pages):'';
 const url=e.doi?(/^10\./.test(e.doi)?'https://doi.org/'+e.doi:e.doi):(e.url||'');
 const U=url?' '+esc(url):'';
 const eds=parseAuthors(e.editors);
 if(style==='apa'){
  const au=A.length?andList(A.map(a=>esc(a.f)+', '+esc(ini(a))),', ',' et '):'';
  const head=(au||T)+' ('+yr+'). ';
  if(e.type==='article')return head+(au?T+'. ':'')+I(e.container||'')+(e.volume?', '+I(e.volume):'')+(e.issue?'('+esc(e.issue)+')':'')+(pages?', '+pages:'')+'.'+U;
  if(e.type==='chapter')return head+(au?T+'. ':'')+'Dans '+(eds.length?andList(eds.map(a=>esc(ini(a))+' '+esc(a.f)),', ',' et ')+' (dir.), ':'')+I(e.container||'')+(pages?' (p. '+pages+')':'')+'.'+(e.publisher?' '+esc(e.publisher)+'.':'');
  if(e.type==='thesis')return head+(au?I(e.title)+' ':'')+'['+esc(e.extra||'Thèse')+', '+esc(e.publisher||'')+'].'+U;
  if(e.type==='web')return head+(au?I(e.title)+'. ':'')+esc(e.container||'')+'.'+U;
  return head+(au?I(e.title)+'. ':'')+(e.publisher?esc(e.publisher)+'.':'')+U;
 }
 if(style==='mla'){
  const au=A.length?(A.length>2?esc(A[0].f)+', '+esc(given(A[0]))+', et al':andList(A.map((a,i)=>i===0?esc(a.f)+', '+esc(given(a)):esc(given(a))+' '+esc(a.f)),', ',' et ')):'';
  const head=au?au+'. ':'';
  if(e.type==='article')return head+'« '+T+'. » '+I(e.container||'')+(e.volume?', vol. '+esc(e.volume):'')+(e.issue?', no '+esc(e.issue):'')+', '+yr+(pages?', p. '+pages:'')+'.'+U;
  if(e.type==='chapter')return head+'« '+T+'. » '+I(e.container||'')+(eds.length?', édité par '+andList(eds.map(a=>esc(given(a))+' '+esc(a.f)),', ',' et '):'')+', '+esc(e.publisher||'')+', '+yr+(pages?', p. '+pages:'')+'.';
  if(e.type==='thesis')return head+I(e.title)+'. '+yr+'. '+esc(e.publisher||'')+', '+esc(e.extra||'thèse')+'.'+U;
  if(e.type==='web')return head+'« '+T+'. » '+I(e.container||'')+', '+yr+'.'+U;
  return head+I(e.title)+'. '+(e.publisher?esc(e.publisher)+', ':'')+yr+'.'+U;
 }
 /* Chicago, notes et bibliographie */
 const au=A.length?andList(A.map((a,i)=>i===0?esc(a.f)+', '+esc(given(a)):esc(given(a))+' '+esc(a.f)),', ',' et '):'';
 const head=au?au+'. ':'';
 const pub=(e.place?esc(e.place)+' : ':'')+esc(e.publisher||'');
 if(e.type==='article')return head+'« '+T+' ». '+I(e.container||'')+(e.volume?' '+esc(e.volume):'')+(e.issue?', no '+esc(e.issue):'')+' ('+yr+')'+(pages?' : '+pages:'')+'.'+U;
 if(e.type==='chapter')return head+'« '+T+' ». Dans '+I(e.container||'')+(eds.length?', sous la direction de '+andList(eds.map(a=>esc(given(a))+' '+esc(a.f)),', ',' et '):'')+(pages?', '+pages:'')+'. '+(pub?pub+', ':'')+yr+'.';
 if(e.type==='thesis')return head+I(e.title)+'. '+esc(e.extra||'Thèse')+', '+esc(e.publisher||'')+', '+yr+'.'+U;
 if(e.type==='web')return head+'« '+T+' ». '+esc(e.container||'')+'. '+yr+'.'+U;
 return head+I(e.title)+'. '+(pub?pub+', ':'')+yr+'.'+U;
}
function bibtexOf(list){
 const typeMap={book:'book',article:'article',chapter:'incollection',thesis:'phdthesis',web:'misc'};
 const b=s=>'{'+String(s).replace(/[{}]/g,'')+'}';
 return list.map(e=>{
  const A=parseAuthors(e.authors).map(a=>a.f+', '+a.g).join(' and ');
  const f=[];
  if(A)f.push('  author = '+b(A));
  f.push('  title = '+b(e.title||''));
  if(e.year)f.push('  year = '+b(e.year));
  if(e.type==='article'){if(e.container)f.push('  journal = '+b(e.container));}
  else if(e.type==='chapter'){if(e.container)f.push('  booktitle = '+b(e.container));const ed=parseAuthors(e.editors).map(a=>a.f+', '+a.g).join(' and ');if(ed)f.push('  editor = '+b(ed))}
  else if(e.type==='thesis'){if(e.publisher)f.push('  school = '+b(e.publisher))}
  else if(e.type==='web'){if(e.container)f.push('  howpublished = '+b(e.container))}
  if(e.type!=='thesis'&&e.publisher)f.push('  publisher = '+b(e.publisher));
  if(e.place)f.push('  address = '+b(e.place));
  if(e.volume)f.push('  volume = '+b(e.volume));
  if(e.issue)f.push('  number = '+b(e.issue));
  if(e.pages)f.push('  pages = '+b(e.pages));
  if(e.doi)f.push('  doi = '+b(e.doi));
  if(e.url)f.push('  url = '+b(e.url));
  if((e.tags||[]).length)f.push('  keywords = '+b(e.tags.join(', ')));
  return '@'+(typeMap[e.type]||'misc')+'{'+e.key+',\n'+f.join(',\n')+'\n}';
 }).join('\n\n');
}
function risOf(list){
 const tm={book:'BOOK',article:'JOUR',chapter:'CHAP',thesis:'THES',web:'ELEC'};
 return list.map(e=>{
  const r=['TY  - '+(tm[e.type]||'GEN')];
  parseAuthors(e.authors).forEach(a=>r.push('AU  - '+a.f+', '+a.g));
  r.push('TI  - '+(e.title||''));
  if(e.year)r.push('PY  - '+e.year);
  if(e.container)r.push('T2  - '+e.container);
  if(e.publisher)r.push('PB  - '+e.publisher);
  if(e.place)r.push('CY  - '+e.place);
  if(e.volume)r.push('VL  - '+e.volume);
  if(e.issue)r.push('IS  - '+e.issue);
  if(e.pages){const p=String(e.pages).split(/[-–—]/);r.push('SP  - '+p[0].trim());if(p[1])r.push('EP  - '+p[1].trim())}
  if(e.doi)r.push('DO  - '+e.doi);
  if(e.url)r.push('UR  - '+e.url);
  (e.tags||[]).forEach(t=>r.push('KW  - '+t));
  r.push('ER  - ');return r.join('\n');
 }).join('\n\n');
}
function parseBibtex(txt){
 const out=[];let i=0;const n=txt.length;
 while(i<n){
  const at=txt.indexOf('@',i);if(at<0)break;
  const m=/^@(\w+)\s*[{(]/.exec(txt.slice(at,at+40));if(!m){i=at+1;continue}
  let p=at+m[0].length;const comma=txt.indexOf(',',p);if(comma<0)break;
  const type=m[1].toLowerCase(),key=txt.slice(p,comma).trim();p=comma+1;const f={};
  while(p<n){
   while(p<n&&/[\s,]/.test(txt[p]))p++;
   if(txt[p]==='}'||txt[p]===')'){p++;break}
   const eq=txt.indexOf('=',p);if(eq<0){p=n;break}
   const name=txt.slice(p,eq).trim().toLowerCase();p=eq+1;while(p<n&&/\s/.test(txt[p]))p++;
   let val='';
   if(txt[p]==='{'){let d=1;p++;const s=p;while(p<n&&d>0){if(txt[p]==='{')d++;else if(txt[p]==='}')d--;p++}val=txt.slice(s,p-1)}
   else if(txt[p]==='"'){p++;const s=p;while(p<n&&txt[p]!=='"')p++;val=txt.slice(s,p);p++}
   else{const s=p;while(p<n&&!/[,}]/.test(txt[p]))p++;val=txt.slice(s,p).trim()}
   f[name]=val.replace(/\s+/g,' ').replace(/[{}]/g,'').trim();
  }
  i=p;
  const tm={book:'book',article:'article',incollection:'chapter',inbook:'chapter',phdthesis:'thesis',mastersthesis:'thesis',thesis:'thesis',misc:'web',online:'web',inproceedings:'chapter'};
  const A=(f.author||'').split(/\s+and\s+/).filter(Boolean).map(a=>a.includes(',')?a.trim():(()=>{const w=a.trim().split(/\s+/);return w.slice(-1)[0]+', '+w.slice(0,-1).join(' ')})()).join('\n');
  const ED=(f.editor||'').split(/\s+and\s+/).filter(Boolean).join('\n');
  out.push({type:tm[type]||'book',title:f.title||'',authors:A,editors:ED,year:(f.year||(f.date||'').slice(0,4)||''),container:f.journal||f.booktitle||f.howpublished||'',publisher:f.publisher||f.school||f.institution||'',place:f.address||'',volume:f.volume||'',issue:f.number||'',pages:(f.pages||'').replace(/--/g,'–'),doi:f.doi||'',url:f.url||'',tags:(f.keywords||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean),extra:type==='mastersthesis'?'Mémoire de maîtrise':type==='phdthesis'?'Thèse de doctorat':'',_key:key});
 }
 return out;
}

 PARCOURS.bac.regles.forEach(r=>r.codes.forEach(c=>{if(!set.has(c))set.set(c,{c,t:PARCOURS.titres[c]||''})}));

function searchAll(q){
 const n=norm(q.trim());const res=[];
 const add=(k,id,t,s,hay)=>{const h=norm(hay||t+' '+(s||''));if(!n){return}const i=h.indexOf(n);if(i<0)return;const ti=norm(t).indexOf(n);res.push({k,id,t,s,score:(ti===0?0:ti>0?1:2)+(i/1000)})};
 NAV.forEach(v=>add('view',v.id,v.t,'Section',v.t));
 PHILOS.forEach(p=>add('phil',p.id,p.n,p.d+' · '+p.t,p.n+' '+p.t+' '+p.i+' '+p.w.join(' ')));
 THEMES.forEach(t=>add('theme',t.id,t.t,'Thème',t.t+' '+t.d+' '+t.k.join(' ')));
 S.notes.forEach(x=>add('note',x.id,x.title||'Sans titre','Note',x.title+' '+x.text));
 S.lib.forEach(e=>add('lib',e.id,e.title,shortCite(e),e.title+' '+e.authors+' '+(e.tags||[]).join(' ')));
 METHODES.forEach(m=>add('method',m.id,m.t,'Méthode',m.t+' '+m.r));
 SOPHISMES.forEach(s=>add('soph',s.id,s.n,'Sophisme',s.n+' '+s.def));
 allCourses().forEach(c=>add('course',c.c,c.c+(c.t?' · '+c.t:''),'Cours Laval',c.c+' '+c.t));
 return res.sort((a,b)=>a.score-b.score).slice(0,40);
}

function courseRule(code){for(const r of PARCOURS.bac.regles){if(r.codes.includes(code))return r}return null}
function bacCredits(){
 const done=S.progress.done;const B=PARCOURS.bac;
 const oblN=B.obl.filter(c=>done[c]).length;const obl=oblN*3;
 const per={};let elec=0;
 B.regles.forEach(r=>{const n=r.codes.filter(c=>done[c]&&courseRule(c)===r).length;per[r.n]={cr:n*3,cnt:n};elec+=Math.min(n*3,r.max)});
 elec=Math.min(elec,45);
 const lg=Math.min(S.progress.cr.langue||0,9),lib=Math.min(S.progress.cr.libres||0,15);
 const autres=Math.min(lg+lib,15);
 return{obl,oblN,elec,per,autres,lg,lib,total:obl+elec+autres};
}
function matCredits(){
 const c=Math.min(S.progress.cr.m_cours||0,5)*3;
 const r=PARCOURS.mat.recherche.reduce((a,x)=>a+(S.progress.done[x.c]?x.cr:0),0);return c+r;
}
function docCredits(){

 const ex=(S.progress.jal['d-ex1']?3:0)+(S.progress.jal['d-ex2']?3:0);

function lineage(id,dir,depth){
 const seen=new Set([id]);let front=[id];const edges=[];
 for(let d=0;d<depth;d++){const nxt=[];front.forEach(x=>{const p=phil(x);(p[dir]||[]).forEach(y=>{if(phil(y)){edges.push(dir==='by'?[y,x]:[x,y]);if(!seen.has(y)){seen.add(y);nxt.push(y)}}})});front=nxt}
 return{nodes:seen,edges};
}

 const cols=PERIODES.filter(per=>[...nodes].some(n=>phil(n).p===per.id));

 cols.forEach((per,ci)=>{const L=[...nodes].filter(n=>phil(n).p===per.id);L.forEach((n,i)=>{pos[n]={x:ci*colW+colW/2,y:70+i*46}})});

 edges.forEach(e=>{const a=pos[e[0]],b=pos[e[1]];if(a&&b)svg+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="stroke:var(--accent);opacity:.45"/>'});

}

function notesGraph(){
 const nodes=[],idx={};const add=(key,label,kind,ref)=>{if(idx[key]!==undefined)return idx[key];idx[key]=nodes.length;nodes.push({key,label,kind,ref,x:0,y:0,vx:0,vy:0});return idx[key]};
 const edges=[];
 S.notes.forEach(n=>{const a=add('n:'+n.id,n.title||'Sans titre','note',n.id);
  linksOf(n.text).forEach(l=>{const r=resolveLink(l);if(!r)return;const b=add(r.type+':'+r.id,r.type==='note'?(byId(S.notes,r.id)||{}).title:r.type==='phil'?lastName(phil(r.id).n):r.type==='theme'?theme(r.id).t.replace(/ \(.*\)/,''):r.id,r.type,r.id);if(a!==b)edges.push([a,b])});
  tagsOf(n.text).slice(0,3).forEach(t=>{const b=add('t:'+t,'#'+t,'tag',t);edges.push([a,b])})});
 if(!S.notes.length)return '<div class="empty">Le graphe apparaît dès que vous avez des notes. Reliez-les avec [[titre]] pour voir votre réseau d\'idées.</div>';
 const N=Math.min(nodes.length,90);const W=900,H=560;
 nodes.forEach((n,i)=>{const a=i/N*Math.PI*2;n.x=W/2+Math.cos(a)*220;n.y=H/2+Math.sin(a)*160});
 for(let it=0;it<220;it++){
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y;let d2=dx*dx+dy*dy+.01;const f=2600/d2;const d=Math.sqrt(d2);a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
  edges.forEach(e=>{if(e[0]>=N||e[1]>=N)return;const a=nodes[e[0]],b=nodes[e[1]];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.sqrt(dx*dx+dy*dy)+.01;const f=(d-90)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
  nodes.slice(0,N).forEach(n=>{n.vx+=(W/2-n.x)*.004;n.vy+=(H/2-n.y)*.004;n.x+=Math.max(-8,Math.min(8,n.vx));n.y+=Math.max(-8,Math.min(8,n.vy));n.vx*=.6;n.vy*=.6;n.x=Math.max(50,Math.min(W-50,n.x));n.y=Math.max(24,Math.min(H-20,n.y))});
 }
 const col={note:'var(--accent)',phil:'var(--gold)',theme:'var(--ok)',tag:'var(--muted)',course:'var(--warn)'};
 let svg='<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graphe des notes" style="min-width:640px">';
 edges.forEach(e=>{if(e[0]>=N||e[1]>=N)return;const a=nodes[e[0]],b=nodes[e[1]];svg+='<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'"/>'});
 nodes.slice(0,N).forEach(n=>{const act=n.kind==='note'?'opennote':n.kind==='phil'?'openphil':n.kind==='theme'?'opentheme':n.kind==='course'?'opencourse':'ntag';
  svg+='<g data-act="'+act+'" data-arg="'+esc(n.ref)+'" style="cursor:pointer"><circle cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+(n.kind==='note'?7:5)+'" style="fill:'+(col[n.kind]||'var(--muted)')+'"/><text x="'+n.x.toFixed(1)+'" y="'+(n.y-10).toFixed(1)+'" text-anchor="middle">'+esc(String(n.label||'').slice(0,26))+'</text></g>'});
 svg+='</svg>';
 return '<div class="stack"><div class="row tight"><span class="chip" style="color:var(--accent)">● Notes</span><span class="chip gold">● Philosophes</span><span class="chip ok">● Thèmes</span><span class="chip">● Étiquettes</span></div><div style="overflow-x:auto">'+svg+'</div>'+(nodes.length>N?'<p class="small muted">Affichage limité à '+N+' nœuds sur '+nodes.length+'.</p>':'')+'</div>';

const DECKS={concepts:'Concepts',logique:'Logique',methode:'Méthode',philosophes:'Philosophes',perso:'Mes cartes'};
let _cardsCache=null,_cardsKey='';
function allCards(){
 const key=S.cards.length+':'+(S.cards[S.cards.length-1]||{}).id;
 if(_cardsCache&&_cardsKey===key)return _cardsCache;
 const out=[];
 CARTES.forEach((c,i)=>out.push({id:'b'+i,d:c.d,q:c.q,a:c.a}));
 PHILOS.forEach(p=>{
  out.push({id:'p:'+p.id+':i',d:'philosophes',q:'Quelle est l\'idée directrice de '+p.n+' ?',a:p.i});
  out.push({id:'p:'+p.id+':w',d:'philosophes',q:'Quelles sont les œuvres majeures de '+p.n+' ?',a:p.w.join(' ; ')});
  if(p.by.length)out.push({id:'p:'+p.id+':b',d:'philosophes',q:'Par qui '+p.n+' a-t-il été influencé ?',a:p.by.map(x=>phil(x).n).join(', ')});
 });
 S.cards.forEach(c=>out.push({id:'u:'+c.id,d:'perso',q:c.q,a:c.a,user:true}));
 _cardsCache=out;_cardsKey=key;return out;
}
function deckCards(deck){const all=allCards();return deck==='tous'?all:all.filter(c=>c.d===deck)}
function buildSession(deck){
 const t=today();const cards=deckCards(deck);
 const due=cards.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=t);
 const newLeft=Math.max(0,S.settings.newPerDay-(logDay().nw||0));
 const nw=shuffle(cards.filter(c=>!S.srs[c.id])).slice(0,newLeft);
 return{queue:shuffle(due).concat(nw),total:due.length+nw.length,done:0,show:false,deck,again:0};
}
function rate(card,q){
 const s=S.srs[card.id]||{ease:2.5,int:0,reps:0,due:today()};
 if(q===0){s.reps=0;s.int=0;s.ease=Math.max(1.3,s.ease-.2);s.due=today()}
 else{
  if(q===1){s.int=Math.max(1,Math.round((s.int||1)*1.2));s.ease=Math.max(1.3,s.ease-.15)}
  else if(q===2){s.int=s.reps===0?1:s.reps===1?3:Math.round(s.int*s.ease)}
  else{s.int=s.reps===0?3:Math.round(s.int*s.ease*1.3)+1;s.ease=Math.min(3,s.ease+.15)}
  s.reps++;s.due=addDays(today(),s.int);
 }
 return s;
}

function makeQuiz(){
 const qs=[];const withWorks=PHILOS.filter(p=>p.w.some(w=>w[0]!=='('));
 const names=(ex,n)=>shuffle(PHILOS.filter(p=>!ex.includes(p.id))).slice(0,n);
 const build=(text,correct,wrong,expl)=>{const opts=shuffle([correct,...wrong]);qs.push({q:text,opts:opts.map(o=>o.label),ans:opts.findIndex(o=>o===correct),expl})};
 for(let i=0;i<4;i++){const p=pick(withWorks);const w=pick(p.w.filter(x=>x[0]!=='('));build('Qui est l\'auteur de « '+w+' » ?',{label:p.n},names([p.id],3).map(x=>({label:x.n})),p.n+' ('+p.d+')')}

 for(let i=0;i<2;i++){const p=pick(PHILOS.filter(x=>x.by.length));const y=pick(p.by);build('Lequel de ces philosophes a influencé '+p.n+' ?',{label:phil(y).n},names([y,p.id,...p.by],3).map(x=>({label:x.n})),phil(y).n+' → '+p.n)}
 {const p=pick(PHILOS);build('À quelle période appartient '+p.n+' ?',{label:periode(p.p)},shuffle(PERIODES.filter(x=>x.id!==p.p)).slice(0,3).map(x=>({label:x.n})),p.n+' : '+p.d)}
 return shuffle(qs).slice(0,10);
}

/* ====================== Minuteur ====================== */
let timerInt=null;
function tickTimer(force){
 const t=UI.timer;
 if(t.running){t.left=Math.max(0,Math.round((t.end-Date.now())/1000));
  if(t.left<=0){
   t.running=false;
   if(t.mode==='focus'){const m=Math.round(t.total/60);addLog({t:m});toast('Séance terminée : '+m+' min ajoutées à votre journal');t.mode='rest';t.left=S.settings.rest*60;t.total=t.left}
   else{toast('Pause terminée');t.mode='focus';t.left=S.settings.focus*60;t.total=t.left}
   clearInterval(timerInt);timerInt=null;
   if(UI.view==='methode'&&UI.mtab==='entrainement')renderMain(true);
  }
 }
 const d=$('#timer-display');if(d){d.textContent=pad(Math.floor(t.left/60))+':'+pad(t.left%60)}
 const b=$('#timer-btn');if(b)b.textContent=t.running?'Pause':'Démarrer';
 const mm=$('#timer-mode');if(mm)mm.textContent=t.mode==='focus'?'Travail':'Pause';
}
function timerToggle(){
 const t=UI.timer;
 if(!t.total)t.total=t.left;
 if(t.running){t.running=false;t.left=Math.max(0,Math.round((t.end-Date.now())/1000));clearInterval(timerInt);timerInt=null}
 else{t.running=true;t.end=Date.now()+t.left*1000;clearInterval(timerInt);timerInt=setInterval(()=>tickTimer(),500)}
 tickTimer();
}
function timerReset(mins){
 const t=UI.timer;t.running=false;clearInterval(timerInt);timerInt=null;t.mode='focus';t.left=(mins||S.settings.focus)*60;t.total=t.left;tickTimer();
}

 /* notes */
 ntab:a=>{UI.ntab=a;renderMain()},
 ntag:a=>{UI.ntag=a;if(UI.view!=='notes')go('notes');else renderMain(true)},
 tag:a=>{UI.ntag=a;UI.ntab='edit';UI.nid=null;go('notes')},
 opennote:a=>{UI.nid=a;UI.ntab='edit';if(UI.view!=='notes')go('notes');else{renderMain();scrollDetail()}},
 newnote:()=>newNote('','# \n\n'),
 dailynote:()=>dailyNote(),
 tplpick:()=>openSheet('<h3>Choisir un modèle</h3><div class="stack" style="max-height:60vh;overflow:auto">'+METHODES.map(m=>'<button class="item" data-act="tplgo" data-arg="'+m.id+'"><span class="t"><b>'+esc(m.t)+'</b><span>Modèle de note</span></span></button>').join('')+'</div><button class="btn ghost" data-act="close">Fermer</button>'),
 tplgo:a=>{closeSheet();const m=byId(METHODES,a);newNote(m.t,m.m)},
 noteview:a=>{S.settings.noteview=a;Store.touch('settings');const n=byId(S.notes,UI.nid);if(n){$('#note-pane').innerHTML=notePane(n)}},
 notepin:a=>{const n=byId(S.notes,a);n.pin=!n.pin;Store.touch('notes');renderMain(true)},
 notecopy:a=>copyText(byId(S.notes,a).text,'Note copiée'),
 notedl:a=>{const n=byId(S.notes,a);saveFile((norm(n.title).replace(/[^a-z0-9]+/g,'-')||'note')+'.md',n.text)},
 notedel:a=>confirmBox('Supprimer cette note ? Cette action est définitive.','Supprimer',()=>{S.notes=S.notes.filter(n=>n.id!==a);UI.nid=null;Store.touch('notes');renderMain()},true),
 'wl':(a,el)=>{const t=el.dataset.type,id=el.dataset.id;if(t==='phil')openTarget('phil',id);else if(t==='theme')openTarget('theme',id);else if(t==='note')openTarget('note',id);else if(t==='course')openCourse(id)},
 'wl-new':a=>{const n=newNote(a,'# '+a+'\n\n')},
 /* bibliothèque */
 lstat:a=>{UI.lstat=a;renderMain(true)},
 ltag:a=>{UI.ltag=UI.ltag===a?'':a;renderMain(true)},
 openlib:a=>{UI.lid=a;UI.lform=null;if(UI.view!=='biblio')go('biblio');else{renderMain();scrollDetail()}},
 newref:()=>{UI.lform={id:null,e:emptyRef()};UI.lid=null;if(UI.view!=='biblio')go('biblio');else renderMain()},
 editref:a=>{UI.lform={id:a,e:Object.assign({},byId(S.lib,a))};renderMain(true)},
 cancelref:()=>{UI.lform=null;renderMain(true)},
 delref:a=>confirmBox('Supprimer cette référence ?','Supprimer',()=>{S.lib=S.lib.filter(e=>e.id!==a);UI.lid=null;Store.touch('lib');renderMain()},true),
 copykey:a=>copyText('[@'+byId(S.lib,a).key+']','Clé copiée'),
 copycite:a=>{const [id,s]=a.split(':');const e=byId(S.lib,id);copyText(s==='in'?'('+shortCite(e)+')':h2t(citation(e,s)),'Citation copiée')},
 citenote:a=>{const e=byId(S.lib,a);newNote('Fiche : '+e.title.slice(0,70),METHODES.find(m=>m.id==='lecture').m.replace('[auteur, titre]',shortCite(e)+', '+e.title).replace('[@clé]','[@'+e.key+']'))},
 bibimport:()=>openImport(),
 bibexport:()=>openExport(),
 bibfile:()=>pickFile('.bib,.txt,text/plain',t=>{const ta=$('#bibtext');if(ta)ta.value=t}),
 bibdo:()=>{const t=($('#bibtext')||{}).value||'';const L=parseBibtex(t);let n=0;L.forEach(x=>{if(!x.title)return;if(S.lib.some(e=>norm(e.title)===norm(x.title)&&String(e.year)===String(x.year)))return;delete x._key;addRef(Object.assign(x,{status:'toread'}));n++});closeSheet();toast(n?n+' référence(s) importée(s)':'Aucune nouvelle référence trouvée');renderMain()},
 exp:a=>{
  if(a==='bib')saveFile('philstan.bib',bibtexOf(S.lib));
  else if(a==='ris')saveFile('philstan.ris',risOf(S.lib));
  else if(a==='json')saveFile('philstan-references.json',JSON.stringify(S.lib,null,1));
  else if(a==='bibliomd')saveFile('bibliographie.md','# Bibliographie\n\n'+biblioText().split('\n\n').map(x=>x).join('\n\n')+'\n');
  else copyText(biblioText(),'Bibliographie copiée');
 },
 /* réviser */
 rtab:a=>{UI.rtab=a;UI.session=null;renderMain()},
 startsession:a=>{UI.session=buildSession(a);if(!UI.session.queue.length){UI.session=null;toast('Rien à réviser pour ce paquet aujourd\'hui')}renderMain()},
 endsession:()=>{UI.session=null;renderMain()},
 reveal:()=>{if(UI.session){UI.session.show=true;renderMain(true)}},
 rate:a=>{const s=UI.session;if(!s||!s.queue.length||!s.show)return;const c=s.queue.shift();const q=+a;const isNew=!S.srs[c.id];
  S.srs[c.id]=rate(c,q);Store.touch('srs');addLog({c:1,nw:isNew?1:0});
  if(q===0){s.queue.push(c);s.again++}else s.done++;
  s.show=false;renderMain(true)},
 addcard:()=>{const q=$('#cq').value.trim(),a=$('#ca').value.trim();if(!q||!a){toast('Remplissez la question et la réponse');return}S.cards.push({id:uid(),q,a,src:'user'});Store.touch('cards');_cardsCache=null;toast('Carte ajoutée');renderMain(true)},
 delcard:a=>{S.cards=S.cards.filter(c=>c.id!==a);delete S.srs['u:'+a];Store.touch('cards');Store.touch('srs');_cardsCache=null;renderMain(true)},
 quizstart:()=>{UI.quiz={qs:makeQuiz(),i:0,score:0,sel:null};renderMain(true)},
 quizend:()=>{UI.quiz=null;renderMain(true)},
 qans:a=>{const q=UI.quiz;if(q.sel!==null)return;q.sel=+a;if(q.sel===q.qs[q.i].ans)q.score++;renderMain(true)},
 qnext:()=>{const q=UI.quiz;q.i++;q.sel=null;if(q.i>=q.qs.length)addLog({q:1});renderMain(true)},
 /* réglages */
 set:(a,el)=>{const k=el.dataset.k;let v=a;if(k==='font')v=+a;setSetting(k,v);if(k==='level')UI.sbj=null;if(el.dataset.keep){openExport()}else renderMain(true)},
 backup:()=>saveFile('philstan-copie-'+today()+'.json',backupJSON()),
 restore:()=>pickFile('.json,application/json',t=>{try{const o=JSON.parse(t);if(o.app!=='PHILSTAN')throw 0;
   confirmBox('Remplacer vos données actuelles par cette copie ?','Restaurer',()=>{KEYS.forEach(k=>{if(o[k]!==undefined){S[k]=o[k];Store.touch(k)}});S.settings={...DEFAULT_SETTINGS,...S.settings};_cardsCache=null;applySettings();renderMain();toast('Copie restaurée')},true)}catch(e){toast('Fichier non reconnu')}}),
 exportnotes:()=>saveFile('notes-philstan.md',allNotesMd()),
 resetprog:()=>confirmBox('Effacer votre cheminement (cours cochés, crédits, jalons) ?','Effacer',()=>{S.progress={done:{},cr:{},jal:{}};Store.touch('progress');renderMain()},true),
 resetsrs:()=>confirmBox('Effacer l\'historique de révision des cartes ?','Effacer',()=>{S.srs={};Store.touch('srs');renderMain()},true),
 resetall:()=>confirmBox('Effacer toutes vos données PHILSTAN (notes, références, progrès, réglages) ? Cette action est définitive.','Tout effacer',()=>{S.notes=[];S.lib=[];S.srs={};S.cards=[];S.log={};S.meth={};S.progress={done:{},cr:{},jal:{}};S.settings={...DEFAULT_SETTINGS};KEYS.forEach(k=>Store.touch(k));_cardsCache=null;applySettings();UI.nid=null;UI.lid=null;renderMain();toast('Données effacées')},true)
};
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act;const f=ACTS[act];if(!f)return;
 if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#'))ev.preventDefault();
 if(act==='wl'||act==='wl-new'||act==='tag'||act==='openphil'||act==='opentheme'||act==='opennote'||act==='openlib')ev.stopPropagation();
 f(el.dataset.arg,el,ev);
});

/* changements (cases, listes) */
document.addEventListener('change',ev=>{
 const el=ev.target;const k=el.dataset&&el.dataset.chg;if(!k)return;
 const a=el.dataset.arg;
 if(k==='done'){if(el.checked)S.progress.done[a]=true;else delete S.progress.done[a];Store.touch('progress');if(UI.view==='parcours')renderMain(true);else if(UI.view==='accueil')renderMain(true)}
 else if(k==='jal'){if(el.checked)S.progress.jal[a]=true;else delete S.progress.jal[a];Store.touch('progress');renderMain(true)}
 else if(k==='meth'){const [id,i]=a.split(':');const o=S.meth[id]||(S.meth[id]={});if(el.checked)o[i]=true;else delete o[i];Store.touch('meth');renderMain(true)}
 else if(k==='pper'){UI.pper=el.value;$('#phil-list').innerHTML=philListHtml()}
 else if(k==='pth'){UI.pth=el.value;$('#phil-list').innerHTML=philListHtml()}
 else if(k==='tg'){UI.tg=el.value;$('#theme-list').innerHTML=themeListHtml()}
 else if(k==='netsel'){UI.pid=el.value;renderMain(true)}
 else if(k==='motion'){setSetting('motion',el.checked)}
 else if(k==='ftype'){const e=readRefForm();UI.lform.e=Object.assign(UI.lform.e,e);renderMain(true)}
});
/* saisies en direct */
let noteSaveT=null;
document.addEventListener('input',ev=>{
 const el=ev.target;const k=el.dataset&&el.dataset.inp;
 if(el.id==='palq'){UI.pal.sel=0;palRender();return}
 if(!k)return;
 if(k==='pq'){UI.pq=el.value;$('#phil-list').innerHTML=philListHtml()}
 else if(k==='tq'){UI.tq=el.value;$('#theme-list').innerHTML=themeListHtml()}
 else if(k==='nq'){UI.nq=el.value;$('#note-list').innerHTML=noteListHtml()}
 else if(k==='lq'){UI.lq=el.value;$('#lib-list').innerHTML=libListHtml()}
 else if(k==='sq'){$('#soph-list').innerHTML=sophList(el.value)}
 else if(k==='ntitle'||k==='ntext'){
  const n=byId(S.notes,UI.nid);if(!n)return;
  if(k==='ntitle')n.title=el.value;else n.text=el.value;n.upd=Date.now();
  const pv=$('#npreview');if(pv&&k==='ntext')pv.innerHTML=md(n.text);
  clearTimeout(noteSaveT);noteSaveT=setTimeout(()=>{Store.touch('notes');const nm=$('#note-meta');if(nm)nm.innerHTML=noteMeta(n);const nl=$('#note-list');if(nl)nl.innerHTML=noteListHtml()},500);
 }
 else if(k==='fs'){const v=+el.value/100;setSetting('font',v);el.previousElementSibling.textContent='Taille du texte : '+el.value+' %'}
 else if(k==='npd'){setSetting('newPerDay',+el.value);$('#npd-v').textContent=el.value}
 else if(k==='gm'){setSetting('goalMin',+el.value);$('#gm-v').textContent=el.value}
 else if(k==='fo'){setSetting('focus',+el.value);$('#fo-v').textContent=el.value;if(!UI.timer.running&&UI.timer.mode==='focus'){UI.timer.left=+el.value*60;UI.timer.total=UI.timer.left}}
 else if(k==='re'){setSetting('rest',+el.value);$('#re-v').textContent=el.value}
});
document.addEventListener('submit',ev=>{
 if(ev.target.id!=='refform')return;ev.preventDefault();
 const d=readRefForm();if(!d.title){toast('Le titre est obligatoire');return}
 const f=UI.lform;let e;
 if(f.id){e=byId(S.lib,f.id);Object.assign(e,d,{upd:Date.now(),incomplete:false});e.key=slugKey(e)}
 else e=addRef(d);
 Store.touch('lib');UI.lform=null;UI.lid=e.id;renderMain();toast('Référence enregistrée');
});
/* clavier */
document.addEventListener('keydown',ev=>{
 const mod=ev.ctrlKey||ev.metaKey;
 if(mod&&ev.key.toLowerCase()==='k'){ev.preventDefault();if(UI.pal)closeSheet();else openPalette();return}
 if(ev.key==='Escape'&&$('#overlay').firstChild){closeSheet();return}
 if(UI.pal){
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const n=UI.pal.res.length;if(n){UI.pal.sel=(UI.pal.sel+(ev.key==='ArrowDown'?1:-1)+n)%n;palRender();const c=$('#palres [aria-current="true"]');if(c)c.scrollIntoView({block:'nearest'})}}
  else if(ev.key==='Enter'){ev.preventDefault();palGo(UI.pal.sel)}
  return;
 }
 const tg=ev.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
 if(UI.view==='reviser'&&UI.rtab==='cartes'&&UI.session){
  if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();if(!UI.session.show)ACTS.reveal();}
  else if(UI.session.show&&'1234'.includes(ev.key)&&ev.key){ACTS.rate(String(+ev.key-1))}
 }
});
/* tabulation dans l'éditeur */
document.addEventListener('keydown',ev=>{
 if(ev.target.id==='ntext'&&ev.key==='Tab'){ev.preventDefault();const t=ev.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;t.dispatchEvent(new Event('input',{bubbles:true}))}
});

/* ====================== Démarrage ====================== */
async function initCloud(){
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  Store.cloud=db;Store.uid=id;
  const changed=await Store.pull();Store.status='cloud';updateSync();
  if(changed){applySettings();_cardsCache=null;renderMain(true)}
 }catch(e){Store.status='local';updateSync()}
}
function init(){
 Store.loadLocal();applySettings();buildShell();
 const h=location.hash.slice(1);UI.view=VIEWS[h]?h:'accueil';
 if(UI.view==='accueil'||!h)history.replaceState&&0;
 UI.timer.left=S.settings.focus*60;UI.timer.total=UI.timer.left;
 UI.sbj=null;
 renderMain();
 if(!S.settings.onboarded)showOnboard();
 initCloud();
}
init();

</script>
